<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Gamer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <header>
        <div class="container">
            <h1 class="logo">ARENA GAMER</h1>
            <nav>
                <ul class="menu">
                    <li><a href="#">PCs Gamer</a></li>
                    <li><a href="#">Consoles</a></li>
                    <li><a href="#">Jogos/a></li>
                    <li><a href="#">Acessórios</a></li>
                </ul>
            </nav>

            <img src="assets/icons/carrinho.png" alt="Carrinho" class="carrinho">
            <span class="contador-carrinho">0</span>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h2>ESCOLHA O CONSOLE IDEAL PARA SEU ESTILO</h2>
                <a href="" class="button">Saiba Mais</a>
            </div>

            <div class="imagem">
                <img src="/assets/imagens/Consoles.png" alt="">
            </div>
        </section>

        <section class="hero hero--invertido">
            <div class="container">
                <h2>ELEVE SEU SETUP AO NÍVEL PROFISSIONAL</h2>
                <a href="" class="button">Saiba Mais</a>
            </div>
            
            <div class="imagem">
                <img src="/assets/imagens/PCs.png" alt="">
            </div>
        </section>

        <section class="carrossel">
            <div>
                <h2>SEU PRÓXIMO CELULAR AQUI</h2>

                <div class="lista-produtos">
                    <article class="produto-card">
                        <div class="produto-imagem">
                            <img src="/assets/imagens/IPHONE17.png" alt="IPHONE17">
                        </div>

                        <H3>IPHONE 17 PRO MAX</H3>

                        <div class="produto-preco">
                            <div class="preco-principal">
                            <span class="preco-atual">R$ 7.486,00</span>
                            <span class="desconto">-26%</span>
                            </div>

                            <span class="preco-antigo">De: R$ 10.000,00</span>
                        </div>

                        <button class="botao-carrinho">Adicione ao carrinho</button>
                    </article>


                </div>
            </div>
        </section>
    </main>

</body>
</html>
